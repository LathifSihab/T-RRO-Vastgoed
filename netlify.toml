# Netlify: de site is statisch, WHISE loopt via twee functies
# (netlify/functions/aanbod.mjs en lead.mjs, bereikbaar op /api/...).

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# WHISE-gegevens horen NIET in dit bestand, maar in
# Site configuration → Environment variables:
#   WHISE_USERNAME, WHISE_PASSWORD, WHISE_CLIENT_ID, WHISE_OFFICE_ID

# Echte adressen: deze paden tonen index.html, de router in js/main.js
# kiest het zicht. Alle andere onbekende paden krijgen 404.html (status 404).
[[redirects]]
  from = "/aanbod"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/aanbod/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/over"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/verhalen"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/verhalen/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/waardescan"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/woonprofiel"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
